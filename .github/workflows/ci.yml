name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install and build frontend
        run: cd web && npm ci && npm run build

      - name: Frontend type check
        run: cd web && npx tsc --noEmit

      - name: Frontend test type check
        run: cd web && npm run typecheck:test

      - name: Frontend lint
        run: cd web && npm run lint

      # Prettier was never gated in CI, so src/ drifted out of format. Biome's
      # formatter is gated here so it cannot drift again.
      - name: Frontend format check
        run: cd web && npm run format:check

      - name: Frontend test
        run: cd web && npm test

      - name: Build
        run: go build $(go list ./... | grep -v /node_modules/)

      - name: Test
        run: go test $(go list ./... | grep -v /node_modules/) -v -count=1

      - name: Vet
        run: go vet $(go list ./... | grep -v /node_modules/)

  # Boots the server and checks api/openapi.yaml against it in both directions:
  # responses that violate the spec, and responses carrying fields the spec does
  # not document. Also asserts every route registered in main.go is documented,
  # which is what let /api/stats/tools and /api/skills/sessions ship invisible.
  api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install validator dependencies
        run: python3 -m pip install --quiet pyyaml jsonschema

      - name: Create embed placeholder
        run: mkdir -p cmd/claude-monitor/static && echo '<!doctype html>' > cmd/claude-monitor/static/index.html

      - name: Validate OpenAPI spec against the running API
        run: |
          go build -o /tmp/claude-monitor ./cmd/claude-monitor
          # Point HOME at a scratch dir so the run gets its own empty database
          # instead of touching anything pre-existing. Done after `go build`, so
          # the module cache under the real HOME is still used.
          WORKSPACE="$PWD"
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude/projects"
          /tmp/claude-monitor -port 7799 >/tmp/server.log 2>&1 &
          server=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:7799/health >/dev/null 2>&1 && break
            sleep 1
          done
          set +e
          python3 "$WORKSPACE/api/validate_spec.py" \
            http://127.0.0.1:7799 \
            "$WORKSPACE/api/openapi.yaml" \
            "$WORKSPACE/cmd/claude-monitor/main.go"
          status=$?
          set -e
          kill "$server" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::openapi.yaml and the running API disagree — see the report above"
            echo "--- server log ---"
            tail -30 /tmp/server.log
          fi
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # CONTRIBUTING states Go is gofmt-formatted, but nothing enforced it and
      # 12 files had drifted (struct/map alignment left stale by hand-edits).
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v node_modules))
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted; run: gofmt -w \$(git ls-files '*.go' | grep -v node_modules)"
            echo "$unformatted"
            exit 1
          fi

      - name: Check no debug code
        run: |
          if grep -rn 'fmt\.Println' internal/ --include='*.go' | grep -v '_test.go'; then
            echo "::error::Found fmt.Println debug statements in internal/"
            exit 1
          fi

      - name: Create embed placeholder
        run: mkdir -p cmd/claude-monitor/static && echo '<!doctype html>' > cmd/claude-monitor/static/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
        continue-on-error: false

      - name: Security scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... | grep -v /node_modules/)
        continue-on-error: true  # informational — stdlib vulns may not have patches yet

  # Create or update the release PR on pushes to main
  release-please:
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test, lint, api-spec]
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and upload binaries when release-please creates a release. Runs in
  # this workflow (not on the release event), since events created with
  # GITHUB_TOKEN do not trigger other workflows.
  build-binaries:
    permissions:
      contents: write
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
