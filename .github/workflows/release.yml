name: Release

# Called by ci.yml after release-please tags a release; also runnable by hand
# to rebuild a tag.
on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_PAT:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build binaries for (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${TAG_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags="${LDFLAGS}" \
              -o "dist/claude-monitor-${os}-${arch}" ./cmd/claude-monitor
          done

          cd dist
          for bin in claude-monitor-*; do
            # Homebrew's bin.install expects the binary named plain "claude-monitor".
            cp "$bin" claude-monitor
            chmod +x claude-monitor
            tar czf "${bin}.tar.gz" claude-monitor
            rm claude-monitor
          done
          sha256sum *.tar.gz > checksums.txt

      # No --clobber: rebuilt tarballs get new checksums, so replacing assets the
      # tap already points at would break installs, and a rebuilt old tag would
      # then downgrade the tap. Delete the assets first to rebuild on purpose.
      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG_NAME}" dist/*.tar.gz dist/checksums.txt \
            --repo "${{ github.repository }}"

      # Zxela/homebrew-tap holds the only copy of the formula. github.token
      # cannot write to another repo, hence the PAT.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
        run: |
          if [ -z "${HOMEBREW_TAP_PAT}" ]; then
            echo "::error::HOMEBREW_TAP_PAT is not set; the tap was not updated."
            exit 1
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_PAT}@github.com/Zxela/homebrew-tap.git" "${RUNNER_TEMP}/tap"
          formula="${RUNNER_TEMP}/tap/Formula/claude-monitor.rb"

          sed -i "s/^  version \".*\"/  version \"${TAG_NAME#v}\"/" "$formula"
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            sum=$(awk -v f="claude-monitor-${platform}.tar.gz" '$2 == f {print $1}' dist/checksums.txt)
            sed -i "/${platform}/{n;s/sha256 \".*\"/sha256 \"${sum}\"/}" "$formula"
            grep -q "$sum" "$formula" || { echo "::error::sha256 for ${platform} not written"; exit 1; }
          done

          cd "${RUNNER_TEMP}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/claude-monitor.rb
          if git diff --cached --quiet; then
            echo "Tap formula already at ${TAG_NAME}"
          else
            git commit -m "Update claude-monitor to ${TAG_NAME}"
            git push origin main
          fi
