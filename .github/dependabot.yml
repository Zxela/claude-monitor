version: 2

# Dependabot alerts and automated security fixes are enabled in repo settings;
# this file adds scheduled *version* updates on top of those.
#
# Commit prefix is `chore`, which release-please keeps out of the changelog and
# does not release on. A dependency bump therefore ships with the next real
# change — retitle a PR to `fix(deps): ...` when a bump needs its own release.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all routine Go bumps; majors still arrive individually so
      # they can be reviewed on their own.
      go-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The frontend has one runtime dependency (chart.js) and the rest are
      # build/test tooling, so tooling is grouped and chart.js stays separate.
      npm-dev-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"
